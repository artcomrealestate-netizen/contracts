name: Flutter CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  FLUTTER_VERSION: '3.44.8'
  FLUTTER_CHANNEL: 'stable'
  # Required for correct Arabic PDF text shaping (see lib/pdf/quotation_pdf_builder.dart).
  # Without this, some PDF viewers render Arabic text with disconnected letters.
  ARABIC_DEFINE: '--dart-define=use_arabic=true'
  # Selects which Firebase project the Contract System module talks to (see
  # lib/core/config/environment.dart). Release builds must target production,
  # not the `dev` default.
  PROD_DEFINE: '--dart-define=APP_ENV=prod'

jobs:
  # ---------------------------------------------------------------------------
  # 1) TEST GATE — runs on every push and pull_request to main.
  #    Any failing test blocks the build jobs below (they declare `needs: test`).
  # ---------------------------------------------------------------------------
  test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --fatal-warnings

      - name: Run unit & widget tests
        run: flutter test --coverage ${{ env.ARABIC_DEFINE }}

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/lcov.info
          retention-days: 14

  # ---------------------------------------------------------------------------
  # 1b) FIRESTORE RULES GATE — runs in parallel with `test`. Verifies
  #     firestore.rules against the emulator (see firestore-tests/), not just
  #     that the app compiles against it. A failing rules test blocks merge
  #     the same way a failing Dart test does (see build_android/build_ios's
  #     `needs: [test, firestore_rules_test]`).
  # ---------------------------------------------------------------------------
  firestore_rules_test:
    name: Firestore Rules Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The Firebase Emulator Suite requires JDK 21+ (firebase-tools no
      # longer supports older runtimes); don't rely on the runner image's
      # default JDK.
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Firestore rules test dependencies
        working-directory: firestore-tests
        run: npm install

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Run rules tests against the emulator
        # Run from the repo root so the emulator picks up the top-level
        # firebase.json/firestore.rules, while the test command itself
        # executes inside firestore-tests/ where its package.json lives.
        run: firebase emulators:exec --project=demo-qouta-calculator-ci --only firestore "npm --prefix firestore-tests test"

  # ---------------------------------------------------------------------------
  # 2) ANDROID BUILD — only after tests pass, and only on pushes to main
  #    (not on pull_request builds, to avoid burning signing secrets on forks).
  # ---------------------------------------------------------------------------
  build_android:
    name: Build Android (APK + AAB)
    needs: [test, firestore_rules_test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Recreates android/key.properties + the keystore file from GitHub Secrets.
      # If ANDROID_KEYSTORE_BASE64 isn't set, this step is skipped and Gradle
      # (see android/app/build.gradle.kts) falls back to debug signing so the
      # build still succeeds — useful before signing secrets are configured.
      - name: Configure Android release signing
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Build APK (per-ABI)
        run: flutter build apk --release --split-per-abi ${{ env.ARABIC_DEFINE }} ${{ env.PROD_DEFINE }}

      - name: Build App Bundle (Play Store)
        run: flutter build appbundle --release ${{ env.ARABIC_DEFINE }} ${{ env.PROD_DEFINE }}

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: android-appbundle
          path: build/app/outputs/bundle/release/*.aab
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 3) iOS BUILD — only after tests pass, and only on pushes to main.
  #    Always runs an unsigned build first (catches compile errors, needs no
  #    Apple account). If the four Apple signing secrets are present, it then
  #    produces a real, distributable, signed .ipa.
  # ---------------------------------------------------------------------------
  build_ios:
    name: Build iOS (IPA)
    needs: [test, firestore_rules_test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build unsigned iOS archive (compile check, no Apple account needed)
        run: flutter build ipa --release --no-codesign ${{ env.ARABIC_DEFINE }} ${{ env.PROD_DEFINE }}

      - name: Import signing certificate & provisioning profile
        if: ${{ env.APPLE_CERTIFICATE_BASE64 != '' }}
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          PROFILE_PATH="$HOME/Library/MobileDevice/Provisioning Profiles"

          mkdir -p "$PROFILE_PATH"
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          echo "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH/profile.mobileprovision"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Build signed IPA (App Store / Ad-Hoc)
        if: ${{ env.APPLE_CERTIFICATE_BASE64 != '' }}
        env:
          APPLE_EXPORT_OPTIONS_PLIST_BASE64: ${{ secrets.APPLE_EXPORT_OPTIONS_PLIST_BASE64 }}
        run: |
          echo "$APPLE_EXPORT_OPTIONS_PLIST_BASE64" | base64 --decode > ios/ExportOptions.plist
          flutter build ipa --release --export-options-plist=ios/ExportOptions.plist ${{ env.ARABIC_DEFINE }}

      - uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: |
            build/ios/ipa/*.ipa
            build/ios/archive/*.xcarchive
          retention-days: 30
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # 4) RELEASE — only when a version tag (v1.2.3) is pushed. Attaches the
  #    Android/iOS artifacts to a GitHub Release. Optional Slack notification
  #    at the bottom (disabled unless SLACK_WEBHOOK_URL is set).
  # ---------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs: [build_android, build_ios]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/android-apk/*.apk
            artifacts/android-appbundle/*.aab
            artifacts/ios-build/**/*.ipa
          generate_release_notes: true

      # Optional: notify a Slack channel with the release link.
      # Uncomment and set the SLACK_WEBHOOK_URL secret to enable.
      # - name: Notify Slack
      #   if: ${{ env.SLACK_WEBHOOK_URL != '' }}
      #   env:
      #     SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      #   uses: slackapi/slack-github-action@v2
      #   with:
      #     payload: |
      #       {"text": "New qouta_calculator release: ${{ github.ref_name }} - ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}"}
